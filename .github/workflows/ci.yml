name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Nginx for reverse proxy integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx
      - name: Run checks
        run: |
          set -o pipefail
          make check 2>&1 | tee /tmp/nodebridge-check.log
      - name: Report check failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/nodebridge-check.log')
          if path.exists():
              output = path.read_text()[-24000:]
              escaped = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=NodeBridge check output::' + escaped)
          PY
      - run: make release VERSION="$VERSION"
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nodebridge-linux
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodebridge-linux
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
