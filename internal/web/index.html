<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NodeBridge · 服务器连接</title><link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">NodeBridge<span>服务器连接</span></a><div id="toolbar"></div></header>
  <main>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section id="loading" class="card">正在连接…</section>
    <section id="auth" class="card compact" hidden>
      <h1>登录</h1>
      <form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button type="submit">登录</button><button id="register-button" class="secondary" type="button" hidden>创建账号</button></form>
    </section>
    <section id="node-page" hidden>
      <div class="intro"><h1>节点维护</h1></div>
      <section class="workspace local-workspace">
        <div class="workspace-head"><h2>连接状态</h2></div>
        <div class="workspace-body"><div id="local-status"></div><div id="local-forwarding" class="forwarding-controls"></div></div>
        <details class="workspace-section service-settings" id="tcp-services"><summary>Overleaf / TCP 端口转发</summary>
          <p class="muted">授权本机服务端口后，可在 VPS 的“代理”页创建公网转发。SSH 与 TCP 服务分别控制。</p>
          <form id="tcp-port-form" class="row"><label>本机服务端口<input name="port" type="number" min="1" max="65535" placeholder="例如 8080" required></label><button type="submit">授权端口</button></form>
          <div id="tcp-ports"></div><div id="local-tcp-forwarding" class="forwarding-controls"></div>
        </details>
        <section id="pair-section" class="workspace-section"><h2>接入控制台</h2><p class="muted">粘贴 VPS 生成的配对链接。</p><form id="pair-form"><label>配对链接<textarea name="link" placeholder="nodebridge://pair/…" rows="4" required maxlength="8192" spellcheck="false"></textarea></label><button>配对并连接</button></form></section>
      </section>
    </section>
    <section id="dashboard" hidden>
      <div class="intro"><h1>服务器一览</h1><p class="muted">选择服务器，获取 SSH 连接命令。</p></div>
      <section class="workspace"><div class="workspace-head"><h2>服务器</h2><span id="node-summary" class="muted"></span></div><div id="nodes" class="node-list"></div></section>
      <dialog id="ssh-dialog" class="connection-dialog" aria-labelledby="ssh-title">
        <div class="dialog-head"><h2 id="ssh-title">SSH 连接</h2><button id="ssh-close" type="button" class="secondary">关闭</button></div>
        <div id="ssh-feedback" role="status" aria-live="polite" hidden></div>
        <form id="ssh-form"><label>服务器<select name="node" required></select></label><label>Linux 用户名<input name="username" placeholder="例如 fan" required maxlength="64" pattern="[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}" autocomplete="username"></label><button type="submit">生成连接命令</button></form>
        <div id="ssh-result" hidden><div class="copy-row"><code id="ssh-command"></code><button id="copy-ssh" type="button" class="secondary">复制</button></div></div>
      </dialog>
    </section>
  </main>
</body>
</html>
