<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NodeBridge · 服务器连接</title><link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">NodeBridge<span>服务器连接</span></a><div id="toolbar"></div></header>
  <main>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section id="loading" class="card">正在连接…</section>
    <section id="auth" class="card compact" hidden>
      <h1>登录</h1>
      <form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button type="submit">登录</button><button id="register-button" class="secondary" type="button" hidden>创建账号</button></form>
    </section>
    <section id="node-page" hidden>
      <div class="intro"><h1>节点维护</h1></div>
      <section class="card"><h2>连接状态</h2><div id="local-status"></div><div id="local-forwarding" class="forwarding-controls"></div></section>
      <section id="pair-section" class="card"><h2>配对</h2><p class="muted">粘贴 VPS 生成的配对链接。</p><form id="pair-form"><label>配对链接<textarea name="link" placeholder="nodebridge://pair/…" rows="4" required maxlength="8192" spellcheck="false"></textarea></label><button>配对并连接</button></form></section>
    </section>
    <section id="dashboard" hidden>
      <div class="intro"><h1>服务器一览</h1></div>
      <section class="card"><div class="section-head"><h2>节点</h2><span id="node-summary" class="muted"></span></div><div id="nodes" class="node-grid"></div></section>
      <section class="card"><h2>生成 SSH 命令</h2><form id="ssh-form" class="row"><label>服务器<select name="node" required></select></label><label>Linux 用户名<input name="username" placeholder="例如 fan" required maxlength="64" pattern="[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}"></label><button>生成命令</button></form><div id="ssh-result" hidden><div class="copy-row"><code id="ssh-command"></code><button id="copy-ssh" class="secondary">复制</button></div></div></section>
    </section>
  </main>
</body>
</html>
